apiVersion: 1

datasources:
  - name: AivenPostgreSQL
    type: postgres
    access: proxy
    url: $__env{PGHOST}:25007
    user: $__env{PGUSER}
    secureJsonData:
      password: $__env{PGPASSWORD}
    jsonData:
      database: $__env{PGDATABASE}
      sslmode: require
      postgresVersion: 1500
    isDefault: true
    editable: true
