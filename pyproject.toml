[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forest-cover-mlops"
version = "1.0.0"
description = "End-to-End Enterprise MLOps Platform for Forest Cover Type Classification with Real-Time Streaming and Drift Observability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Subhadip Khawas", email = "subhadip.khawas@alumni.ie.edu" }
]
keywords = [
    "mlops",
    "lightgbm",
    "kafka",
    "fastapi",
    "mlflow",
    "grafana",
    "evidently-ai",
    "data-drift",
    "streaming"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux"
]

dependencies = [
    # Core Data Science & Modeling
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<1.5.0",
    "lightgbm>=4.0.0,<5.0.0",
    "optuna>=3.2.0,<4.0.0",
    "joblib>=1.3.0,<2.0.0",

    # API & Serving Engine
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.23.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",

    # Event Streaming & Ingestion
    "confluent-kafka>=2.3.0,<3.0.0",

    # Lifecycle & Metadata Tracking
    "mlflow>=2.10.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "boto3>=1.28.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",

    # Monitoring, Observability & Drift
    "evidently>=0.4.0,<0.5.0",
    "prometheus-client>=0.17.0,<1.0.0",
    "scipy>=1.11.0,<2.0.0",
    "python-pptx>=1.0.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "httpx>=0.24.0"
]

[project.scripts]
forest-stream = "backend.streaming.producer:main"
forest-consumer = "backend.streaming.consumer:main"
forest-drift = "backend.monitoring.drift_service:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | mlruns
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "build", "dist", "mlruns", "data"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]
